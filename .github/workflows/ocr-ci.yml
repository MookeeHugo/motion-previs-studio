name: OCR CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "chore/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Detect project layout
        id: layout
        shell: bash
        run: |
          [[ -f package.json ]] && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          [[ -f src-tauri/Cargo.toml ]] && echo "cargo=true" >> "$GITHUB_OUTPUT" || echo "cargo=false" >> "$GITHUB_OUTPUT"
          [[ -f src-tauri/tauri.conf.json ]] && echo "tauri_config=true" >> "$GITHUB_OUTPUT" || echo "tauri_config=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.layout.outputs.node == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        if: steps.layout.outputs.node == 'true'
        run: npm ci

      - name: Typecheck when available
        if: steps.layout.outputs.node == 'true'
        run: npm run typecheck --if-present

      - name: Lint when available
        if: steps.layout.outputs.node == 'true'
        run: npm run lint --if-present

      - name: Test when available
        if: steps.layout.outputs.node == 'true'
        run: npm test --if-present

      - name: Build frontend when available
        if: steps.layout.outputs.node == 'true'
        run: npm run build --if-present

      - name: Install Linux dependencies for Tauri checks
        if: steps.layout.outputs.cargo == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install Rust quality components
        if: steps.layout.outputs.cargo == 'true'
        run: rustup component add rustfmt clippy

      - name: Check Rust formatting
        if: steps.layout.outputs.cargo == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust clippy
        if: steps.layout.outputs.cargo == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        if: steps.layout.outputs.cargo == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Validate Tauri JSON config
        if: steps.layout.outputs.tauri_config == 'true'
        run: |
          python -m json.tool src-tauri/tauri.conf.json > /dev/null
          find src-tauri/capabilities -name '*.json' -print0 2>/dev/null | xargs -0 -r -n1 python -m json.tool > /dev/null
